      - name: Reply result to /release-action comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = '${{ needs.validate.outputs.release_tag }}';
            const success = '${{ steps.publish_release.outcome }}' === 'success';
            const repo = '${{ github.repository }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const triggerCommentId = ${{ github.event.comment.id }}; // 你发的/release-action评论ID
            const [owner, repoName] = repo.split('/');

            let body;
            if (success) {
              body = `✅ Release **${tag}** 创建成功！\nRelease: https://github.com/${repo}/releases/tag/${tag}`;
            } else {
              body = `❌ Release **${tag}** 创建失败，请查看流水线日志：${runUrl}`;
            }

            // 直接回复到触发指令的评论下，作为子回复
            await github.rest.issues.createCommentReply({
              owner: owner,
              repo: repoName,
              comment_id: triggerCommentId,
              body: body
            });
